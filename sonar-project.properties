sonar.projectKey=laravel-base-project
sonar.organization=anugrahjayaaaa
sonar.projectName=Laravel Base Project

sonar.sources=app
sonar.tests=tests
sonar.test.inclusions=tests/**/*.php

# PHP coverage (clover format generated by pest --coverage-clover)
sonar.php.coverage.reportPaths=build/logs/clover.xml

# Exclude generated / vendored from duplication & coverage
sonar.exclusions=app/Helpers/i18n.php,vendor/**,node_modules/**
