name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pcov
          coverage: pcov
          tools: composer:v2, pint

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Pint (lint)
        run: vendor/bin/pint --test

      - name: Run tests with coverage
        run: composer test:coverage

      - name: Upload coverage (clover) artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-coverage
          path: build/logs/clover.xml

      # SonarCloud — disabled for now; enable later by setting repo secret SONAR_TOKEN
      # (and creating the project at sonarcloud.io). Flip to `if: ${{ env.SONAR_TOKEN != '' }}`.
      - name: SonarCloud Scan
        if: false
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
